name: release

# Builds the Rust hooks for every supported platform and attaches them to a
# release, so `install.sh` on another machine can download a binary instead of
# requiring a Rust toolchain.
#
# Native runners on purpose: cross-compiling to aarch64-apple-darwin from Linux
# produces a binary Apple Silicon refuses to execute ("Killed: 9"), because it
# lacks even an ad-hoc code signature. Native clang linking signs it for free.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13        # Intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tooling
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rust unit tests
        working-directory: rust
        run: cargo test --release --target ${{ matrix.target }}

      # The whole point of the port is that behavior is unchanged. A binary that
      # diverges from the JS hooks must never reach a release.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Differential test vs the JS hooks
        run: node test/differential.js "rust/target/${{ matrix.target }}/release/omp-hooks"

      - name: Package
        run: |
          BIN=rust/target/${{ matrix.target }}/release/omp-hooks
          ls -l "$BIN"
          tar -czf "omp-hooks-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" omp-hooks

      - uses: actions/upload-artifact@v4
        with:
          name: omp-hooks-${{ matrix.target }}
          path: omp-hooks-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true
